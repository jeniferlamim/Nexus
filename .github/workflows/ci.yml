name: ci
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/engine/requirements-dev.txt
      - name: Tests on SQLite
        run: cd services/engine && python -m pytest -q
      - name: Tests on PostgreSQL
        run: |
          psql -d postgres -c "create database nexus_py"
          cd services/engine && NEXUS_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/nexus_py python -m pytest -q
      - name: Supabase migrations + RLS / governance checks
        run: ./supabase/tests/run.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd apps/web && npm ci && npm run build
